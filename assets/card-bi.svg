<svg xmlns="http://www.w3.org/2000/svg" width="590" height="240" viewBox="0 0 590 240" role="img" aria-label="Port of Figueira da Foz BI &amp; Data Mart">
  <defs>
    <style>
      .title { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #FFFFFF; }
      .desc { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 400; fill: #E2E8F0; }
      .mono-meta { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; letter-spacing: 1.8px; fill: #94A3B8; }
      .mono-link { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 500; fill: #94A3B8; }
      .mono-btn { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; fill: #60A5FA; }
    </style>
  </defs>

  <!-- Card surface with sharp border -->
  <rect x=".5" y=".5" width="589" height="239" rx="12" fill="#0E1626" stroke="#2B374E" stroke-width="1.2"/>

  <!-- Accent top line -->
  <rect x="24" y="19" width="32" height="3.5" rx="1.75" fill="#3B82F6"/>

  <!-- Category & Index -->
  <text x="24" y="44" class="mono-meta">DATA ENGINEERING · BI</text>
  <text x="566" y="44" text-anchor="end" class="mono-meta">03 // 2024</text>

  <!-- Title -->
  <text x="24" y="80" class="title">Port of Figueira da Foz BI &amp; Data Mart</text>

  <!-- Description with high contrast -->
  <text x="24" y="108" class="desc">Snowflake schema Data Mart powered by an automated Python ETL pipeline,</text>
  <text x="24" y="128" class="desc">consolidating operational MySQL into SQL Server with 5 Power BI reports.</text>

  <!-- Tag Pills -->
  <rect x="24" y="150" width="63" height="27" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="55" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F8FAFC">Python</text>
<rect x="95" y="150" width="94" height="27" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="142" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F8FAFC">SQL Server</text>
<rect x="197" y="150" width="78" height="27" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="236" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F8FAFC">Power BI</text>
<rect x="283" y="150" width="116" height="27" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="341" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F8FAFC">ETL Pipelines</text>


  <!-- Divider -->
  <line x1="24" y1="193" x2="566" y2="193" stroke="#2B374E" stroke-width="1.2"/>

