<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Daniel Silva — Junior Computer Engineer">
  <defs>
    <style>
      .chip-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; fill: #CBD5E1; letter-spacing: 1px; }
      .name { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 56px; font-weight: 800; fill: #FFFFFF; letter-spacing: -1.5px; }
      .role { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; fill: #60A5FA; }
      .tagline { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15.5px; font-weight: 500; fill: #F1F5F9; }
      .subdesc { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14.5px; font-weight: 400; fill: #CBD5E1; }
      .badge-tag { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; fill: #E2E8F0; }
    </style>
    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="#0A101D" stroke="#2B374E" stroke-width="1.2"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>

  <!-- Status Chip Top Left -->
  <g transform="translate(48, 34)">
    <rect width="380" height="30" rx="15" fill="#141E33" stroke="#334155" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="5" fill="#10B981"/>
    <circle cx="16" cy="15" r="9" fill="#10B981" opacity="0.3">
      <animate attributeName="r" values="5;10;5" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.05;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="19.5" class="chip-text">OPEN TO OPPORTUNITIES // AVEIRO, PT · REMOTE</text>
  </g>

  <!-- Top Right WorldSkills Honor -->
  <g transform="translate(850, 34)">
    <rect width="302" height="30" rx="6" fill="#141E33" stroke="#334155" stroke-width="1.2"/>
    <text x="151" y="19.5" text-anchor="middle" class="chip-text" fill="#F8FAFC">🏅 WORLDSKILLS MEDAL OF EXCELLENCE</text>
  </g>

  <!-- Main Name & Title -->
  <text x="48" y="130" class="name">Daniel Silva</text>
  <text x="48" y="166" class="role">Junior Computer Engineer — AI, Information Systems &amp; SAP</text>

  <!-- Bio & Tagline (High Contrast) -->
  <text x="48" y="204" class="tagline">“From analysis to impact.” · Building systems that connect enterprise data, business processes, and AI.</text>
  <text x="48" y="226" class="subdesc">From industrial CNC precision to Python backend pipelines, RAG architectures, and agent orchestration.</text>

  <!-- Bottom Divider -->
  <line x1="48" y1="262" x2="1152" y2="262" stroke="#2B374E" stroke-width="1.2"/>

  <!-- Core Pillars Footer -->
  <g transform="translate(48, 283)">
    <rect x="0" y="0" width="138" height="28" rx="6" fill="#141E33" stroke="#334155" stroke-width="1.2"/>
    <text x="69" y="18.5" text-anchor="middle" class="badge-tag">Python &amp; Backend</text>

    <rect x="146" y="0" width="150" height="28" rx="6" fill="#141E33" stroke="#334155" stroke-width="1.2"/>
    <text x="221" y="18.5" text-anchor="middle" class="badge-tag">RAG &amp; pgvector</text>

    <rect x="304" y="0" width="176" height="28" rx="6" fill="#141E33" stroke="#334155" stroke-width="1.2"/>
    <text x="392" y="18.5" text-anchor="middle" class="badge-tag">BPMN 2.0 &amp; OML / ERP</text>

    <rect x="488" y="0" width="168" height="28" rx="6" fill="#141E33" stroke="#334155" stroke-width="1.2"/>
    <text x="572" y="18.5" text-anchor="middle" class="badge-tag">Snowflake Data Marts</text>

    <rect x="664" y="0" width="136" height="28" rx="6" fill="#141E33" stroke="#334155" stroke-width="1.2"/>
    <text x="732" y="18.5" text-anchor="middle" class="badge-tag">SAP Progression</text>

    <rect x="808" y="0" width="154" height="28" rx="6" fill="#141E33" stroke="#334155" stroke-width="1.2"/>
    <text x="885" y="18.5" text-anchor="middle" class="badge-tag">Power BI Dashboards</text>

    <text x="1104" y="18.5" text-anchor="end" class="chip-text" fill="#94A3B8">ISEC · DEGREE</text>
  </g>
</svg>
