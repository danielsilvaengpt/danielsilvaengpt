<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Daniel Silva — Engenheiro Informático Júnior">
  <defs>
    <style>
      .chip-text { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; fill: #94A3B8; letter-spacing: 1px; }
      .name { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 54px; font-weight: 800; fill: #F8FAFC; letter-spacing: -1.5px; }
      .role { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 21px; font-weight: 600; fill: #60A5FA; }
      .tagline { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 400; fill: #CBD5E1; }
      .badge-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #94A3B8; }
    </style>
    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="#0B0F17" stroke="#1E293B"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>

  <!-- Status Chip Top Left -->
  <g transform="translate(48, 36)">
    <rect width="365" height="28" rx="14" fill="#111827" stroke="#1E293B"/>
    <circle cx="16" cy="14" r="4.5" fill="#10B981"/>
    <circle cx="16" cy="14" r="8" fill="#10B981" opacity="0.25">
      <animate attributeName="r" values="4;9;4" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.05;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="18" class="chip-text">DISPONÍVEL PARA NOVOS DESAFIOS // AVEIRO, PT</text>
  </g>

  <!-- Top Right WorldSkills Honor -->
  <g transform="translate(860, 36)">
    <rect width="292" height="28" rx="6" fill="#111827" stroke="#1E293B"/>
    <text x="146" y="18" text-anchor="middle" class="chip-text" fill="#E2E8F0">🏅 WORLDSKILLS MEDALHA DE EXCELÊNCIA</text>
  </g>

  <!-- Main Name & Title -->
  <text x="48" y="132" class="name">Daniel Silva</text>
  <text x="48" y="168" class="role">Engenheiro Informático Júnior — IA, Sistemas de Informação &amp; SAP</text>

  <!-- Bio & Tagline -->
  <text x="48" y="206" class="tagline">“Da análise ao impacto.” · Construo sistemas que ligam dados, processos de negócio e inteligência artificial.</text>
  <text x="48" y="228" class="tagline">Do rigor mecânico industrial com máquinas CNC ao desenvolvimento backend em Python e orquestração agêntica.</text>

  <!-- Bottom Divider -->
  <line x1="48" y1="264" x2="1152" y2="264" stroke="#1E293B"/>

  <!-- Core Pillars Footer -->
  <g transform="translate(48, 285)">
    <rect x="0" y="0" width="132" height="26" rx="5" fill="#111827" stroke="#1E293B"/>
    <text x="66" y="17" text-anchor="middle" class="badge-tag">Python &amp; Backend</text>

    <rect x="140" y="0" width="145" height="26" rx="5" fill="#111827" stroke="#1E293B"/>
    <text x="212" y="17" text-anchor="middle" class="badge-tag">RAG &amp; pgvector</text>

    <rect x="293" y="0" width="170" height="26" rx="5" fill="#111827" stroke="#1E293B"/>
    <text x="378" y="17" text-anchor="middle" class="badge-tag">BPMN 2.0 &amp; OML / ERP</text>

    <rect x="471" y="0" width="160" height="26" rx="5" fill="#111827" stroke="#1E293B"/>
    <text x="551" y="17" text-anchor="middle" class="badge-tag">Snowflake Data Marts</text>

    <rect x="639" y="0" width="130" height="26" rx="5" fill="#111827" stroke="#1E293B"/>
    <text x="704" y="17" text-anchor="middle" class="badge-tag">SAP Progression</text>

    <rect x="777" y="0" width="145" height="26" rx="5" fill="#111827" stroke="#1E293B"/>
    <text x="849" y="17" text-anchor="middle" class="badge-tag">Power BI Dashboards</text>

    <text x="1104" y="17" text-anchor="end" class="chip-text" fill="#64748B">ISEC · LICENCIATURA</text>
  </g>
</svg>
