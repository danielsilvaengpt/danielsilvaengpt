<svg xmlns="http://www.w3.org/2000/svg" width="590" height="240" viewBox="0 0 590 240" role="img" aria-label="DermoScan AI — Skin Disease Classifier">
  <defs>
    <style>
      .title { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #FFFFFF; }
      .desc { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 400; fill: #E2E8F0; }
      .mono-meta { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; letter-spacing: 1.8px; fill: #94A3B8; }
      .mono-link { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 500; fill: #94A3B8; }
      .mono-btn { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; fill: #60A5FA; }
    </style>
  </defs>

  <!-- Card surface with sharp border -->
  <rect x=".5" y=".5" width="589" height="239" rx="12" fill="#0E1626" stroke="#2B374E" stroke-width="1.2"/>

  <!-- Accent top line -->
  <rect x="24" y="19" width="32" height="3.5" rx="1.75" fill="#10B981"/>

  <!-- Category & Index -->
  <text x="24" y="44" class="mono-meta">MACHINE LEARNING · COMPUTER VISION</text>
  <text x="566" y="44" text-anchor="end" class="mono-meta">04 // 2024</text>

  <!-- Title -->
  <text x="24" y="80" class="title">DermoScan AI — Skin Disease Classifier</text>

  <!-- Description with high contrast -->
  <text x="24" y="108" class="desc">Diagnostic image classifier with MobileNetV2 Transfer Learning</text>
  <text x="24" y="128" class="desc">and Random Search optimization, achieving 72% benchmark accuracy.</text>

  <!-- Tag Pills -->
  <rect x="24" y="150" width="63" height="27" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="55" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F8FAFC">Python</text>
<rect x="95" y="150" width="101" height="27" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="145" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F8FAFC">MobileNetV2</text>
<rect x="204" y="150" width="147" height="27" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="277" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F8FAFC">Transfer Learning</text>
<rect x="359" y="150" width="86" height="27" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="402" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F8FAFC">Streamlit</text>


  <!-- Divider -->
  <line x1="24" y1="193" x2="566" y2="193" stroke="#2B374E" stroke-width="1.2"/>

