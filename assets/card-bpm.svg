<svg xmlns="http://www.w3.org/2000/svg" width="560" height="244" viewBox="0 0 560 244" role="img">
  <title>Business Process Modeling &amp; OML: Industrial process analysis (AS-IS/TO-BE), BPMN and ERP foundations</title>
  <defs>
