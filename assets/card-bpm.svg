    <line x1="22" y1="18" x2="38" y2="18" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="38" y="8" width="36" height="20" rx="4" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
    <line x1="74" y1="18" x2="90" y2="18" stroke="#3B82F6" stroke-width="1.5"/>
    <polygon points="90,18 97,11 104,18 97,25" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  </g>

  <!-- Primary accent bar (Blue/Linear style matching portfolio) -->
  <rect x="32" y="26" width="30" height="3" rx="1.5" fill="#3B82F6"/>

