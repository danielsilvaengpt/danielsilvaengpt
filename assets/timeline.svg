<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Percurso Profissional: 4 Estágios">
  <defs>
    <style>
      .t-title { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14.5px; font-weight: 700; fill: #F8FAFC; }
      .t-company { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #60A5FA; }
      .t-desc { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94A3B8; }
      .t-year { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #64748B; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1200" height="200" rx="14" fill="#0B0F17" stroke="#1E293B"/>

  <!-- Connecting Line across all 4 stages -->
  <line x1="80" y1="46" x2="1120" y2="46" stroke="#1E293B" stroke-width="2"/>
  <line x1="80" y1="46" x2="1120" y2="46" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Stage 1: OPTIMA IT & Hardware -->
  <g transform="translate(80, 0)">
    <circle cx="0" cy="46" r="8" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="0" cy="46" r="3.5" fill="#3B82F6"/>
    <text x="0" y="26" class="t-year">2022 · JUN–JUL</text>
    <text x="0" y="78" class="t-title">IT &amp; Hardware Industrial</text>
    <text x="0" y="96" class="t-company">OPTIMA Equipamentos CNC</text>
    <text x="0" y="116" class="t-desc">Digitalização 3D, corte laser,</text>
    <text x="0" y="132" class="t-desc">automações Python &amp; eixos XYZ.</text>
  </g>

  <!-- Stage 2: OPTIMA Software CNC -->
  <g transform="translate(390, 0)">
    <circle cx="0" cy="46" r="8" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="0" cy="46" r="3.5" fill="#3B82F6"/>
    <text x="0" y="26" class="t-year">2023 · ABR–JUN</text>
    <text x="0" y="78" class="t-title">Software Developer CNC</text>
    <text x="0" y="96" class="t-company">OPTIMA Equipamentos CNC</text>
    <text x="0" y="116" class="t-desc">Software de raiz para matriz 3D,</text>
    <text x="0" y="132" class="t-desc">trigonometria euclidiana &amp; GUI.</text>
  </g>

  <!-- Stage 3: Internet Web Solutions (Málaga) -->
  <g transform="translate(710, 0)">
    <circle cx="0" cy="46" r="8" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="0" cy="46" r="3.5" fill="#3B82F6"/>
    <text x="0" y="26" class="t-year">2023 · ABR–MAI · ERASMUS+ 🇪🇸</text>
    <text x="0" y="78" class="t-title">Full-Stack Web Developer</text>
    <text x="0" y="96" class="t-company">Internet Web Solutions (Málaga)</text>
    <text x="0" y="116" class="t-desc">App WaterWise em PHP, MySQL,</text>
    <text x="0" y="132" class="t-desc">fluxos em tempo real com AJAX.</text>
  </g>

  <!-- Stage 4: Meight AI Engineer -->
  <g transform="translate(1010, 0)">
    <circle cx="0" cy="46" r="9" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2.5"/>
    <circle cx="0" cy="46" r="4" fill="#60A5FA"/>
    <text x="0" y="26" class="t-year" fill="#60A5FA">2026 · FEV–JUN</text>
    <text x="0" y="78" class="t-title">Engenheiro de IA</text>
    <text x="0" y="96" class="t-company">Meight (Data Team)</text>
    <text x="0" y="116" class="t-desc">Hybrid Search com pgvector,</text>
    <text x="0" y="132" class="t-desc">embeddings &amp; onboarding tool.</text>
  </g>
</svg>
