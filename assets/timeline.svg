<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="205" viewBox="0 0 1200 205" role="img" aria-label="Career Journey: 4 Internships">
  <defs>
    <style>
      .t-title { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; }
      .t-company { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #60A5FA; }
      .t-desc { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 400; fill: #CBD5E1; }
      .t-year { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; fill: #94A3B8; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="1200" height="205" rx="14" fill="#0A101D" stroke="#2B374E" stroke-width="1.2"/>

  <!-- Connecting Line across all 4 stages -->
  <line x1="80" y1="46" x2="1120" y2="46" stroke="#2B374E" stroke-width="2"/>
  <line x1="80" y1="46" x2="1120" y2="46" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Stage 1: OPTIMA IT & Hardware -->
  <g transform="translate(80, 0)">
    <circle cx="0" cy="46" r="8" fill="#141E33" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="0" cy="46" r="3.5" fill="#3B82F6"/>
    <text x="0" y="26" class="t-year">2022 · JUN–JUL</text>
    <text x="0" y="78" class="t-title">Industrial IT &amp; Hardware</text>
    <text x="0" y="96" class="t-company">OPTIMA CNC Equipment</text>
    <text x="0" y="117" class="t-desc">3D scanning, laser calibration,</text>
    <text x="0" y="133" class="t-desc">Python scripts &amp; XYZ motion logic.</text>
  </g>

  <!-- Stage 2: OPTIMA Software CNC -->
  <g transform="translate(390, 0)">
    <circle cx="0" cy="46" r="8" fill="#141E33" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="0" cy="46" r="3.5" fill="#3B82F6"/>
    <text x="0" y="26" class="t-year">2023 · APR–JUN</text>
    <text x="0" y="78" class="t-title">CNC Software Developer</text>
    <text x="0" y="96" class="t-company">OPTIMA CNC Equipment</text>
    <text x="0" y="117" class="t-desc">From-scratch Python 3D suite,</text>
    <text x="0" y="133" class="t-desc">Euclidean geometry &amp; machine GUI.</text>
  </g>

  <!-- Stage 3: Internet Web Solutions (Málaga) -->
  <g transform="translate(710, 0)">
    <circle cx="0" cy="46" r="8" fill="#141E33" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="0" cy="46" r="3.5" fill="#3B82F6"/>
    <text x="0" y="26" class="t-year">2023 · APR–MAY · ERASMUS+ 🇪🇸</text>
    <text x="0" y="78" class="t-title">Full-Stack Web Developer</text>
    <text x="0" y="96" class="t-company">Internet Web Solutions (Málaga)</text>
    <text x="0" y="117" class="t-desc">WaterWise web app in PHP &amp; MySQL,</text>
    <text x="0" y="133" class="t-desc">real-time computation with AJAX.</text>
  </g>

  <!-- Stage 4: Meight AI Engineer -->
  <g transform="translate(1010, 0)">
    <circle cx="0" cy="46" r="9" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2.5"/>
    <circle cx="0" cy="46" r="4" fill="#60A5FA"/>
    <text x="0" y="26" class="t-year" fill="#60A5FA">2026 · FEB–JUN</text>
    <text x="0" y="78" class="t-title">AI Engineer (Data Team)</text>
    <text x="0" y="96" class="t-company">Meight</text>
    <text x="0" y="117" class="t-desc">Hybrid Search with pgvector,</text>
    <text x="0" y="133" class="t-desc">embeddings &amp; onboarding pipeline.</text>
  </g>
</svg>
