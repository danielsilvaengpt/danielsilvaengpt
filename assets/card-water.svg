<svg xmlns="http://www.w3.org/2000/svg" width="590" height="240" viewBox="0 0 590 240" role="img" aria-label="WaterWise Calculator (Málaga, Spain)">
  <defs>
    <style>
      .title { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #FFFFFF; }
      .desc { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 400; fill: #E2E8F0; }
      .mono-meta { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; letter-spacing: 1.8px; fill: #94A3B8; }
      .mono-link { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 500; fill: #94A3B8; }
      .mono-btn { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; fill: #60A5FA; }
    </style>
  </defs>

  <!-- Card surface with sharp border -->
  <rect x=".5" y=".5" width="589" height="239" rx="12" fill="#0E1626" stroke="#2B374E" stroke-width="1.2"/>

  <!-- Accent top line -->
  <rect x="24" y="19" width="32" height="3.5" rx="1.75" fill="#60A5FA"/>

  <!-- Category & Index -->
  <text x="24" y="44" class="mono-meta">FULL-STACK WEB · ERASMUS+</text>
  <text x="566" y="44" text-anchor="end" class="mono-meta">06 // 2023</text>

  <!-- Title -->
  <text x="24" y="80" class="title">WaterWise Calculator (Málaga, Spain)</text>

  <!-- Description with high contrast -->
  <text x="24" y="108" class="desc">Web application calculating dietary water footprint in real time</text>
  <text x="24" y="128" class="desc">with PHP, MySQL, and dynamic AJAX flows, developed during Erasmus+.</text>

  <!-- Tag Pills -->
  <rect x="24" y="150" width="40" height="27" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="44" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F8FAFC">PHP</text>
<rect x="72" y="150" width="56" height="27" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="100" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F8FAFC">MySQL</text>
<rect x="136" y="150" width="48" height="27" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="160" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F8FAFC">AJAX</text>
<rect x="192" y="150" width="94" height="27" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="239" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F8FAFC">JavaScript</text>
<rect x="294" y="150" width="48" height="27" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
<text x="318" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F8FAFC">CSS3</text>


  <!-- Divider -->
  <line x1="24" y1="193" x2="566" y2="193" stroke="#2B374E" stroke-width="1.2"/>

  <!-- Footer link -->
  <text x="24" y="219" class="mono-link">github.com/danielsilvaengpt/WaterWise-Calculator</text>
  <text x="566" y="219" text-anchor="end" class="mono-btn">View Project ↗</text>
</svg>
